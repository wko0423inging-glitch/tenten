workflows:
  android-release:
    name: Android Release (Google Play)
    max_build_duration: 60
    environment:
      groups:
        - google_play
      vars:
        BUNDLE_ID: com.tenten.ios
      flutter: stable

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Build Android APK
        script: flutter build apk --release

      - name: Build Android App Bundle
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic-TenTen

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tenten.ios
      vars:
        BUNDLE_ID: com.tenten.ios
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>ZVJ5H9S337</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.tenten.ios</key>
              <string>tenten_app_store</string>
            </dict>
          </dict>
          </plist>
          EOF
          flutter build ipa --release \
            --export-options-plist=/tmp/ExportOptions.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
