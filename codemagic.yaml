workflows:
  android-release:
    name: Android Release (Google Play)
    max_build_duration: 60
    environment:
      groups:
        - google_play
      vars:
        BUNDLE_ID: com.tenten.app
      flutter: stable

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Build Android APK
        script: flutter build apk --release

      - name: Build Android App Bundle
        script: flutter build appbundle --release

    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

  ios-release:
    name: iOS Release (App Store)
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic-TenTen

    environment:
      vars:
        BUNDLE_ID: com.tenten.ios
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Set up code signing
        script: |
          set -ex
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles --custom-export-options '{"method": "app-store"}'
          cat /Users/builder/export_options.plist

      - name: Build iOS IPA
        script: |
          flutter build ios --release --no-codesign
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --export-options-plist /Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
