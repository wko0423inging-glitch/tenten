name: tenten
description: "A Flutter file sharing application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  bonsoir: ^7.1.1
  file_picker: ^8.0.0
  path_provider: ^2.1.0
  permission_handler: ^11.0.0
  receive_sharing_intent: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
